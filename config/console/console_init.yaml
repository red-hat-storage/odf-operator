apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
spec:
  selector:
    matchLabels:
      app: odf-console
  replicas: 1
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: odf-console
    spec:
      automountServiceAccountToken: false
      containers:
        - name: odf-console
          image: odf-console:latest
          command:
            - /bin/sh
            - -c
            - |
              (
                echo "Waiting for Nginx master process to start."
                until nginx -s reload > /dev/null 2>&1; do
                  sleep 1
                done

                LAST_HASH=$(md5sum /opt/app-root/etc/nginx.d/*.conf 2>/dev/null | sort | md5sum)
                echo "Nginx is up. Monitoring config changes."

                while true; do
                  CURRENT_HASH=$(md5sum /opt/app-root/etc/nginx.d/*.conf 2>/dev/null | sort | md5sum)
                  if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
                    if nginx -t && nginx -s reload; then
                      LAST_HASH="$CURRENT_HASH"
                    fi
                  fi
                  sleep 45
                done
              ) &

              if [ -x /usr/libexec/s2i/run ]; then
                exec /usr/libexec/s2i/run
              else
                exec nginx -g "daemon off;"
              fi
          resources:
            limits:
              cpu: "100m"
              memory: "512Mi"
            requests:
              cpu: "10m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: 9001
              scheme: HTTPS
            initialDelaySeconds: 180
            periodSeconds: 60
          ports:
            - containerPort: 9001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: odf-console-serving-cert
              mountPath: /var/serving-cert
              readOnly: true
            - name: odf-console-nginx-conf
              mountPath: /opt/app-root/etc/nginx.d
              readOnly: true
            - name: odf-console-nginx-log
              mountPath: /var/log/nginx
            - name: odf-console-nginx-tmp
              mountPath: /var/lib/nginx/tmp
      tolerations:
      - effect: NoSchedule
        key: node.ocs.openshift.io/storage
        operator: Equal
        value: "true"
      volumes:
        - name: odf-console-serving-cert
          secret:
            secretName: odf-console-serving-cert
        - name: odf-console-nginx-conf
          configMap:
            name: odf-console-nginx-conf
        - name: odf-console-nginx-log
          emptyDir: {}
        - name: odf-console-nginx-tmp
          emptyDir: {}
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
